<!DOCTYPE html>
<html>

<head>
    <title>AI Resume Analyzer</title>
</head>

<body>

    <h1>AI Resume Analyzer</h1>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="resume" required>

        <button type="submit">
            Analyze Resume
        </button>

    </form>

    {% if analysis %}

        <h2>AI Feedback</h2>

        <p>{{ analysis }}</p>

    {% endif %}

</body>

</html>
